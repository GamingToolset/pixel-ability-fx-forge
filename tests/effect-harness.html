<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Ability FX verification</title>
</head>
<body data-status="running">
    <pre id="result">Running effect verification…</pre>
    <script type="module">
        import { AbilityEffect, createEffectRecipe, renderEffectFrames } from '../js/AbilityEffect.js?v=3';

        const signatures = [];
        const families = ['burst', 'barrier', 'aura'];
        const failures = [];

        const frameSignature = (effect, time) => {
            const canvas = document.createElement('canvas');
            canvas.width = 160;
            canvas.height = 160;
            const context = canvas.getContext('2d');
            effect.draw(context, time, { showTarget: false });
            const data = context.getImageData(0, 0, 160, 160).data;
            let occupied = 0;
            let checksum = 2166136261;
            for (let index = 0; index < data.length; index += 4) {
                if (data[index + 3] > 0) occupied += 1;
                checksum ^= data[index] + data[index + 1] * 3 + data[index + 2] * 7 + data[index + 3] * 11;
                checksum = Math.imul(checksum, 16777619);
            }
            return { occupied, checksum: checksum >>> 0 };
        };

        families.forEach((family, familyIndex) => {
            const recipe = createEffectRecipe({ family, element: 'arcane', seed: 8100 + familyIndex });
            const effect = new AbilityEffect(recipe);
            const first = frameSignature(effect, effect.duration * 0.42);
            const second = frameSignature(new AbilityEffect(recipe), effect.duration * 0.42);
            const start = frameSignature(effect, 0);
            const finish = frameSignature(effect, effect.duration);

            if (first.occupied < 20) failures.push(`${family}: mid-cast frame is nearly empty`);
            if (first.checksum !== second.checksum) failures.push(`${family}: render is not deterministic`);
            if (finish.occupied !== 0) failures.push(`${family}: final frame is not transparent`);
            if (effect.particleCount < 20) failures.push(`${family}: insufficient generated particles`);
            signatures.push({
                family,
                duration: Number(effect.duration.toFixed(3)),
                particleCount: effect.particleCount,
                start,
                middle: first,
                finish
            });
        });

        if (new Set(signatures.map((item) => item.middle.checksum)).size !== families.length) {
            failures.push('family compositions are not visually distinct');
        }

        const exportRecipe = createEffectRecipe({ family: 'burst', element: 'fire', seed: 4242 });
        const rendered = await renderEffectFrames({ recipe: exportRecipe, size: 128, frameCount: 8 });
        if (rendered.frames.length !== 8) failures.push('frame renderer returned the wrong frame count');
        if (rendered.frames.some((frame) => frame.width !== 128 || frame.height !== 128)) {
            failures.push('frame renderer returned the wrong dimensions');
        }

        const result = {
            passed: failures.length === 0,
            failures,
            exportFrames: rendered.frames.length,
            exportSize: `${rendered.frames[0].width}x${rendered.frames[0].height}`,
            signatures
        };
        document.body.dataset.status = result.passed ? 'passed' : 'failed';
        document.querySelector('#result').textContent = JSON.stringify(result, null, 2);
    </script>
</body>
</html>
