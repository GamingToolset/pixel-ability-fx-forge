<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Ability FX verification</title>
</head>
<body data-status="running">
    <pre id="result">Running effect verification…</pre>
    <script type="module">
        import { AbilityEffect, createEffectRecipe, renderEffectFrames } from '../js/AbilityEffect.js?v=8';

        setTimeout(async () => {
        const signatures = [];
        const families = ['burst', 'barrier', 'aura'];
        const failures = [];

        const frameSignature = (effect, time) => {
            const canvas = document.createElement('canvas');
            canvas.width = 160;
            canvas.height = 160;
            const context = canvas.getContext('2d');
            effect.draw(context, time);
            const data = context.getImageData(0, 0, 160, 160).data;
            let occupied = 0;
            let edgePixels = 0;
            let checksum = 2166136261;
            for (let pixel = 0; pixel < data.length / 4; pixel += 1) {
                const index = pixel * 4;
                const x = pixel % 160;
                const y = Math.floor(pixel / 160);
                if (data[index + 3] > 0) occupied += 1;
                if (data[index + 3] > 0 && (x === 0 || x === 159 || y === 0 || y === 159)) edgePixels += 1;
                checksum ^= data[index] + data[index + 1] * 3 + data[index + 2] * 7 + data[index + 3] * 11;
                checksum = Math.imul(checksum, 16777619);
            }
            return { occupied, edgePixels, checksum: checksum >>> 0 };
        };

        const edgePixelCount = (effect, time) => {
            const canvas = document.createElement('canvas');
            canvas.width = 160;
            canvas.height = 160;
            const context = canvas.getContext('2d');
            effect.draw(context, time);
            const strips = [
                context.getImageData(0, 0, 160, 1).data,
                context.getImageData(0, 159, 160, 1).data,
                context.getImageData(0, 1, 1, 158).data,
                context.getImageData(159, 1, 1, 158).data
            ];
            let occupied = 0;
            for (const strip of strips) {
                for (let index = 3; index < strip.length; index += 4) {
                    if (strip[index] > 0) occupied += 1;
                }
            }
            return occupied;
        };

        families.forEach((family, familyIndex) => {
            const recipe = createEffectRecipe({ family, element: 'arcane', seed: 8100 + familyIndex });
            const effect = new AbilityEffect(recipe);
            const first = frameSignature(effect, effect.duration * 0.42);
            const second = frameSignature(new AbilityEffect(recipe), effect.duration * 0.42);
            const start = frameSignature(effect, 0);
            const finish = frameSignature(effect, effect.duration);

            if (first.occupied < 20) failures.push(`${family}: mid-cast frame is nearly empty`);
            if (first.checksum !== second.checksum) failures.push(`${family}: render is not deterministic`);
            if (finish.occupied !== 0) failures.push(`${family}: final frame is not transparent`);
            if (effect.particleCount < 20) failures.push(`${family}: insufficient generated particles`);
            signatures.push({
                family,
                duration: Number(effect.duration.toFixed(3)),
                particleCount: effect.particleCount,
                start,
                middle: first,
                finish
            });
        });

        if (new Set(signatures.map((item) => item.middle.checksum)).size !== families.length) {
            failures.push('family compositions are not visually distinct');
        }

        const verificationPhases = [0.18, 0.42, 0.72];
        const recipes = Array.from({ length: 384 }, (_, index) => createEffectRecipe({ seed: 10000 + index }));
        const recipeDna = recipes.map((recipe) => JSON.stringify({
            family: recipe.family,
            element: recipe.element,
            formation: recipe.formation,
            secondaryFormation: recipe.secondaryFormation,
            geometry: recipe.geometry,
            secondaryGeometry: recipe.secondaryGeometry,
            hybrid: recipe.hybrid,
            flow: recipe.flow,
            trace: recipe.traceStyle,
            secondaryTrace: recipe.secondaryTraceStyle,
            temporalStyle: recipe.temporalStyle,
            particleKit: recipe.particleKit,
            layers: recipe.layers,
            symmetry: recipe.symmetry,
            radius: Number(recipe.radius.toFixed(3)),
            aspectX: Number(recipe.aspectX.toFixed(3)),
            aspectY: Number(recipe.aspectY.toFixed(3)),
            tilt: Number(recipe.tilt.toFixed(3))
        }));
        const uniqueRecipeCount = new Set(recipeDna).size;
        if (uniqueRecipeCount !== recipes.length) failures.push('different seeds produced duplicate recipe DNA');
        if (recipes.some((recipe) => recipe.originX !== 80 || recipe.originY !== 80)) {
            failures.push('one or more recipes moved the animation pivot away from (80, 80)');
        }
        let edgeSafeFrames = 0;
        for (let recipeIndex = 0; recipeIndex < recipes.length; recipeIndex += 1) {
            const recipe = recipes[recipeIndex];
            const effect = new AbilityEffect(recipe);
            for (const phase of verificationPhases) {
                const occupiedEdgePixels = edgePixelCount(effect, recipe.duration * phase);
                if (occupiedEdgePixels !== 0) {
                    failures.push(`${recipe.family}/${recipe.seed} at ${phase}: ${occupiedEdgePixels} boundary pixels were occupied`);
                }
                edgeSafeFrames += 1;
            }
            await new Promise(requestAnimationFrame);
        }

        const formationCoverage = Object.fromEntries(families.map((family) => {
            const variants = Array.from({ length: 512 }, (_, index) => createEffectRecipe({ family, seed: 50000 + index }));
            return [family, new Set(variants.map((recipe) => recipe.formation)).size];
        }));
        for (const [family, count] of Object.entries(formationCoverage)) {
            if (count < 16) failures.push(`${family}: only ${count} formation types were generated`);
        }

        const renderedFormationSignatures = [];
        for (const family of families) {
            const representatives = new Map();
            for (let seed = 70000; seed < 71000 && representatives.size < 16; seed += 1) {
                const recipe = createEffectRecipe({ family, element: 'storm', seed });
                if (!representatives.has(recipe.formation)) representatives.set(recipe.formation, recipe);
            }
            for (const [formation, recipe] of representatives) {
                const effect = new AbilityEffect(recipe);
                for (const phase of verificationPhases) {
                    const signature = frameSignature(effect, recipe.duration * phase);
                    if (signature.edgePixels !== 0) {
                        failures.push(`${family}/${formation} at ${phase}: ${signature.edgePixels} boundary pixels were occupied`);
                    }
                    if (phase === 0.42 && signature.occupied < 20) {
                        failures.push(`${family}/${formation}: representative frame is nearly empty`);
                    }
                    if (phase === 0.42) renderedFormationSignatures.push(`${family}:${formation}:${signature.checksum}`);
                    edgeSafeFrames += 1;
                }
            }
        }
        if (renderedFormationSignatures.length !== 48) {
            failures.push(`only ${renderedFormationSignatures.length} of 48 formations were rendered`);
        }

        const exportRecipe = createEffectRecipe({ family: 'burst', element: 'fire', seed: 4242 });
        const rendered = await renderEffectFrames({ recipe: exportRecipe, size: 128, frameCount: 8 });
        if (rendered.frames.length !== 8) failures.push('frame renderer returned the wrong frame count');
        if (rendered.frames.some((frame) => frame.width !== 128 || frame.height !== 128)) {
            failures.push('frame renderer returned the wrong dimensions');
        }

        const result = {
            passed: failures.length === 0,
            failures,
            exportFrames: rendered.frames.length,
            exportSize: `${rendered.frames[0].width}x${rendered.frames[0].height}`,
            uniqueRecipeCount,
            formationCoverage,
            renderedFormationCount: renderedFormationSignatures.length,
            fixedPivot: [80, 80],
            edgeSafeFrames,
            signatures
        };
        document.body.dataset.status = result.passed ? 'passed' : 'failed';
        document.querySelector('#result').textContent = JSON.stringify(result, null, 2);
        }, 0);
    </script>
</body>
</html>
